<title>Kanvas</title>
<style>
/* Layout: pro-app shell — app bar, contextual options bar, left tool rail, canvas stage with floating task bar, right Layers drawer, bottom panels */
:root{
  --chrome:#1f1f1f; --panel:#2a2a2a; --raised:#383838; --hover:#444; --line:#3d3d3d; --stage:#141414;
  --fg:#ececec; --mut:#a6a6a6; --dim:#7a7a7a; --acc:#3b8beb; --acc-hi:#5aa0f2; --acc-ink:#fff; --danger:#f0565c;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#appbar{height:46px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--chrome);border-bottom:1px solid #000}
.logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#1c3f73,#3b8beb);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em;margin-right:6px;flex:none}
#docTitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
#docTitle b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#docTitle span{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--fg);flex:none}
.ib:active,.ib.on{background:var(--raised)}
.ib.on{color:var(--acc-hi)}
.ib[disabled]{opacity:.3}
#opts{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid #000;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#opts::-webkit-scrollbar{display:none}
.ol{font-size:11px;color:var(--mut);white-space:nowrap}
.ov{font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;white-space:nowrap}
.osl{display:flex;align-items:center;gap:6px;flex:none}
.osl input{width:92px}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.seg{display:flex;background:var(--chrome);border:1px solid var(--line);border-radius:7px;padding:2px;flex:none}
.seg button{padding:5px 9px;border-radius:5px;font-size:12px;white-space:nowrap;color:var(--mut);display:flex;align-items:center;gap:5px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--raised);color:var(--fg)}
.chipbtn{display:flex;align-items:center;gap:6px;background:var(--chrome);border:1px solid var(--line);border-radius:7px;padding:4px 8px;flex:none;max-width:160px}
.chipbtn canvas{width:44px;height:18px;flex:none}
.chipbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.chipbtn svg{width:14px;height:14px;color:var(--mut);flex:none}
.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex:none;white-space:nowrap}
.tog i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;display:block;transition:background .15s}
.tog i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#ddd;top:2px;left:2px;transition:left .15s}
.tog.on i{background:var(--acc)}.tog.on i::after{left:14px;background:#fff}
.tog.on{color:var(--fg)}
#main{flex:1;display:flex;min-height:0;position:relative}
#tools{width:50px;flex:none;background:var(--chrome);border-right:1px solid #000;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;scrollbar-width:none;touch-action:pan-y}
#tools::-webkit-scrollbar{display:none}
.tl{width:40px;height:40px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--mut);position:relative}
.tl svg{width:21px;height:21px}
.tl.on{background:var(--raised);color:#fff}
.tl.on::before{content:"";position:absolute;left:-5px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--acc)}
.tl.grp::after{content:"";position:absolute;right:4px;bottom:4px;border:3px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.7}
.tsep{width:26px;height:1px;background:var(--line);margin:4px 0;flex:none}
#fg{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;margin:8px 0 4px;flex:none}
#stage{flex:1;position:relative;background:var(--stage);overflow:hidden;min-width:0}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#task{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;background:rgba(42,42,42,.97);border:1px solid var(--line);border-radius:12px;padding:4px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.55);max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#task button{padding:8px 10px;border-radius:8px;white-space:nowrap;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
#task button svg{width:17px;height:17px}
#task button:active{background:var(--raised)}
#task .pri{background:var(--acc);color:#fff}
#zoomChip{position:absolute;left:8px;bottom:8px;z-index:3;background:rgba(31,31,31,.9);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(20,20,20,.95);border:1px solid var(--line);padding:8px 13px;border-radius:9px;font-size:12px;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100% - 24px);text-align:center}
#toast.on{opacity:1}
#loupe{position:absolute;width:62px;height:62px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #000,0 4px 14px rgba(0,0,0,.5);pointer-events:none;z-index:6;transform:translate(-50%,-130%)}
#layers{position:absolute;top:0;right:0;bottom:0;width:min(310px,84vw);background:var(--panel);border-left:1px solid #000;z-index:8;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s ease;box-shadow:-10px 0 30px rgba(0,0,0,.45)}
#layers.open{transform:none}
.ph{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);flex:none}
.ph h2{flex:1;margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.lprops{padding:8px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);flex:none}
.lprops .r{display:flex;align-items:center;gap:8px}
.lprops select{flex:1}
#lyList{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px 0}
.ly{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 6px;width:100%;text-align:left;border-left:3px solid transparent}
.ly.on{background:#2f3d52;border-left-color:var(--acc)}
.ly .eye{width:30px;height:30px;display:grid;place-items:center;color:var(--mut);flex:none}
.ly .eye.off{opacity:.45}
.ly .nm{flex:1;min-width:0}
.ly .nm b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly .nm span{font-size:10.5px;color:var(--mut)}
.ly.clip{padding-left:22px}
.thumb{width:42px;height:42px;border-radius:3px;flex:none;border:1px solid #000;background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.lfoot{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:4px;flex:none}
.badge{font-size:9px;font-weight:700;letter-spacing:.05em;background:#4a4a4a;color:#ddd;border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:1px}
.badge.b{background:var(--acc);color:#fff}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:64%;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:10;transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet.open{transform:none}
#sheet.tall{max-height:86%}
.sh-head{display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex:none}
.sh-head h2{flex:1;margin:0;font-size:14px;font-weight:700}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:7px auto 3px;flex:none}
.sh-body{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));touch-action:pan-y;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dng{color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:7px;background:var(--chrome);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sect{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;padding-top:2px}
.sl{display:grid;grid-template-columns:104px 1fr 50px;align-items:center;gap:10px}
.sl span:first-child{font-size:12.5px}
.sl output{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;touch-action:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#f2f2f2;margin-top:-7.5px;border:2px solid var(--panel);box-shadow:0 0 0 1px #000}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#f2f2f2;border:2px solid var(--panel)}
input[type=text],input[type=number],textarea,select{background:var(--chrome);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:14px;width:100%;min-width:0;user-select:text;-webkit-user-select:text}
select{padding:6px 8px;font-size:12.5px}
textarea{min-height:72px;resize:vertical}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;text-align:left;width:100%}
.item:active{background:var(--raised)}
.item svg{color:var(--mut)}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.item .sub{font-size:11.5px;color:var(--mut)}
.brow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;width:100%;text-align:left;border:1px solid transparent}
.brow.on{background:#2f3d52;border-color:var(--acc)}
.brow canvas{width:132px;height:34px;flex:none}
.brow .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;text-align:center}
.tile svg{width:26px;height:26px;color:var(--fg)}
.tile:active{background:var(--raised)}
#sv{width:100%;height:170px;border-radius:8px;touch-action:none;display:block}
#hue{width:100%;height:22px;border-radius:11px;touch-action:none;display:block}
.sw{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.14)}
.fontrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:8px;width:100%;text-align:left;border-bottom:1px solid #333}
.fontrow:active{background:var(--raised)}
.fontrow .fn{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fontrow .fc{font-size:10px;color:var(--mut);flex:none;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:0}
.card{background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.anchor{display:grid;grid-template-columns:repeat(3,30px);gap:4px}
.anchor button{width:30px;height:30px;border-radius:5px;background:var(--chrome);border:1px solid var(--line)}
.anchor button.on{background:var(--acc);border-color:var(--acc)}
#cropC{width:100%;border-radius:8px;touch-action:none;background:#fff}
#tips{position:absolute;inset:auto 10px 64px 10px;z-index:5;background:rgba(42,42,42,.98);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tips b{color:var(--acc-hi)}
#tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
#viewer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#viewer img{max-height:75%;max-width:100%;border-radius:6px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
@media (prefers-reduced-motion:reduce){#sheet,#layers,#toast{transition:none}}
</style>

<div id="app">
  <header id="appbar">
    <div class="logo" aria-hidden="true">Kv</div>
    <div id="docTitle"><b>Untitled</b><span>1200 × 1600 px</span></div>
    <button class="ib" id="bUndo" aria-label="Undo"></button>
    <button class="ib" id="bRedo" aria-label="Redo"></button>
    <button class="ib" id="bLayers" aria-label="Layers"></button>
    <button class="ib" id="bExport" aria-label="Export"></button>
    <button class="ib" id="bMenu" aria-label="More"></button>
  </header>
  <div id="opts"></div>
  <div id="main">
    <nav id="tools" aria-label="Tools">
      <button class="tl" data-tool="move" aria-label="Move and transform"></button>
      <button class="tl grp" data-tool="select" aria-label="Selection"></button>
      <div class="tsep"></div>
      <button class="tl" data-tool="brush" aria-label="Brush"></button>
      <button class="tl" data-tool="eraser" aria-label="Eraser"></button>
      <button class="tl" data-tool="smudge" aria-label="Smudge"></button>
      <button class="tl" data-tool="blur" aria-label="Blur"></button>
      <button class="tl" data-tool="fill" aria-label="Fill"></button>
      <button class="tl" data-tool="picker" aria-label="Eyedropper"></button>
      <button class="tl" data-tool="text" aria-label="Text"></button>
      <div class="tsep"></div>
      <button class="tl" id="tAdjust" aria-label="Adjust and filters"></button>
      <button class="tl" id="tCanvas" aria-label="Canvas"></button>
      <button id="fg" aria-label="Color"></button>
    </nav>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="task" hidden></div>
      <button id="zoomChip" aria-label="Fit canvas to screen">100%</button>
      <div id="loupe" hidden></div>
      <div id="toast"></div>
    </div>
    <aside id="layers" aria-label="Layers">
      <div class="ph"><h2>Layers</h2><button class="ib" id="lyClose" aria-label="Close layers"></button></div>
      <div class="lprops">
        <div class="r"><select id="lblend" aria-label="Blend mode"></select></div>
        <div class="r"><span class="ol">Opacity</span><input type="range" id="lop" min="0" max="1" step="0.01" aria-label="Layer opacity"><span class="ov" id="lopo">100%</span></div>
        <div class="r"><button class="tog" id="lclip"><i></i>Clip</button><button class="tog" id="llock"><i></i>Lock alpha</button></div>
      </div>
      <div id="lyList"></div>
      <div class="lfoot">
        <button class="ib" data-la="add" aria-label="New layer"></button>
        <button class="ib" data-la="dup" aria-label="Duplicate layer"></button>
        <button class="ib" data-la="photo" aria-label="Add photo"></button>
        <button class="ib" data-la="merge" aria-label="Merge down"></button>
        <button class="ib" data-la="up" aria-label="Move up"></button>
        <button class="ib" data-la="down" aria-label="Move down"></button>
        <button class="ib" data-la="more" aria-label="More layer actions"></button>
        <button class="ib" data-la="del" aria-label="Delete layer"></button>
      </div>
    </aside>
  </div>
</div>
<div id="sheet" role="dialog"><div class="grab"></div><div class="sh-head"><h2 id="shTitle"></h2><button class="ib" id="shClose" aria-label="Close"></button></div><div class="sh-body" id="shBody"></div></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="fileQR" accept="image/*" hidden>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>

$('#fileFont').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const name=f.name.replace(/\.(ttf|otf|woff2?)$/i,'').replace(/[-_]+/g,' ');const ok=await addFontBuffer(name,await f.arrayBuffer(),true);if(ok){toast('Added '+name);fontCat='mine';fontPickCb?fontPickCb(name):openFonts(null)}else toast('That file isn’t a font this device can read. Try a .ttf or .otf.')};

/* ibisPaint brush QR: "IPBZ" + 4 bytes + raw-deflate payload (big-endian floats, Java modified-UTF-8 name) */
async function inflateRaw(u8){const ds=new DecompressionStream('deflate-raw');return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer())}
function decodeMUTF8(b){const u=[];let i=0;while(i<b.length){const c=b[i];if(c<0x80){u.push(c);i++}else if((c&0xe0)===0xc0){if(i+1>=b.length)return null;u.push(((c&0x1f)<<6)|(b[i+1]&0x3f));i+=2}else if((c&0xf0)===0xe0){if(i+2>=b.length)return null;u.push(((c&0x0f)<<12)|((b[i+1]&0x3f)<<6)|(b[i+2]&0x3f));i+=3}else if((c&0xf8)===0xf0){if(i+3>=b.length)return null;let cp=((c&7)<<18)|((b[i+1]&0x3f)<<12)|((b[i+2]&0x3f)<<6)|(b[i+3]&0x3f);cp-=0x10000;u.push(0xd800+(cp>>10),0xdc00+(cp&0x3ff));i+=4}else return null}return String.fromCharCode(...u)}
async function parseIbisBrush(bytes){const u=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='IPBZ')throw new Error('not-ibis');const d=await inflateRaw(u.subarray(8)),dv=new DataView(d.buffer,d.byteOffset,d.byteLength),f=o=>dv.getFloat32(o,false),i32=o=>dv.getUint32(o,false);
 let name='',ids=[];for(let p=0;p+20<d.length;p++){if(i32(p)!==16)continue;let q=p;const got=[];while(q+20<=d.length&&i32(q)===16){got.push([...d.subarray(q+4,q+20)].map(x=>x.toString(16).padStart(2,'0')).join(''));q+=20}if(q+2>d.length)continue;const L=dv.getUint16(q,false);if(L<1||L>200||q+2+L>d.length)continue;const s=decodeMUTF8(d.subarray(q+2,q+2+L));if(s&&!/[\u0000-\u001f]/.test(s)){name=s;ids=got;break}}
 return{name:name||'Imported brush',baseId:i32(12),size:f(20),maxSize:f(24),curve:[f(28),f(32),f(36),f(40)],angle:f(44),spacing:f(48),ids,raw:btoa(String.fromCharCode(...u))}}
function ibisToBrush(p,tip){const sz=isFinite(p.size)&&p.size>0?p.size:20;return normB({id:'ib'+Date.now()+Math.floor(Math.random()*1e4),name:p.name,tip:tip||'round',size:clamp(Math.round(sz*10)/10,1,500),spacing:clamp(isFinite(p.spacing)?p.spacing*2:.08,.03,1),smooth:.3,taperStart:15,taperEnd:20,minSize:.25,angle:clamp(Math.round(p.angle)||0,0,180),custom:true,ibis:{baseId:p.baseId,raw:p.raw}})}
const SEED_QR=[['SVBCWgAB+9BjZGBiYmBgNGRgYmBmYFB3YWBgYHa2YWBwqWJgsG9AxSBgo3ydyx5Iv1ggIAri23091M+ABmBqSQHoeuxmzpwFpATuanznTjNU2bCFwZytYvb1hyCxpf4MjisfRrPyqx5J/ni7xJOBOzEvvajy7YK9bzctAmn+DwQgR9r6nDnrsACrfZiGEALKBQ4wpu3hExX///87DgA=','round',{size:40,note:'From your ibisPaint QR. This one stamps a custom picture (the anger marks), and that picture isn’t stored inside the QR, so it draws with a plain round tip for now.'}],
 ['SVBCWgACIuJjZGBiYmBgTGUAkgwMGuZAgtGxgIHB+RcDg73g61YQtvuw+DoIOwElbVnldtg3MDC8UJgga88AAXCaqT8GTDcwEAT7tVvl9202Nobx7fhjNJ29gHorAt/YJ7qvs5s5cxZQWOB8fs03N8sCIRG3H0+Sg1bVgMSW+jM4rnwYzcqveiT54+0STwZhj8SilNQiBZfElJRKhbcL9r3duhVk6H8gADnO1ufMWYcFWN2BaRgaAHkcTD90X8fAwMSIItfIpgqkmGCeRvI4NjGge/5NBgA=','round',{taperStart:40,taperEnd:60,minSize:.15,smooth:.45,note:'From your ibisPaint QR. Size and spacing come straight from the code; the taper is set by hand until the other settings are mapped.'}],
 ['SVBCWgACIuJjZGBiYmBgzGIAkgwM6oJAgtlh58xZLrYODPbGxsb2eiLV9q9sC+3ldgSBVNgoX+eyB9IvFAREQXz7BgYwsJecOQuEQWy7mUA2z5mz9jIa3xiIBDBzYABkBpASWPpQSXKver3dgfRfmqb2+36CxfwZHFc+jGblVz2S/PF2iSeDRHFqcn5eikJ+QUlmfp5CWn6RQnF2aklyBsik/0AAcrGtz5mzDguwWo5pIl7AhOpyp/4YmCDIF0g+wSYGdM+/PgA=','pencil',{opacity:.9,flow:.55,minSize:.5,note:'From your ibisPaint QR. Size and spacing come straight from the code; the grain tip is the closest match.'}],
 ['SVBCWgACI0RjZGBiYmBgLGUAkgwM6lFAto9LFQMDCNsvvs5lP29HkP3pVnn7C4uvO4szMNjOnDnLvoGB4YWihDgDFNiFc9naSULEQQBE2z10X2fHKreDgUhguyPwDVhvxtfDMDOAQEBWvnKu3s7g3rmL/55zdAy9ABK73vjYumr61bkSE6bUt/mcnc3A/GjmIpDq/0BgD3LQW74wJwaEY8C0z5mzIM23wkK9eJu2sJ/pEw7eecStGOxYp/4YuEP6YzRtz4DVAgETiiPtznjuggmC9MHMxiGGwYeYceasHdT8////NQMA','halftone',{size:180,spacing:.18,taperStart:0,taperEnd:0,minSize:1,note:'From your ibisPaint QR (the halftone one). The dot screen is rebuilt with the Halftone tip.'}]];
async function seedIbis(){const out=[];for(const[b64,tip,ov]of SEED_QR){try{const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const p=await parseIbisBrush(bytes);out.push(Object.assign(ibisToBrush(p,tip),ov))}catch(e){}}return out}
function loadScript(src){return new Promise(res=>{const s=document.createElement('script');s.src=src;s.onload=()=>res(true);s.onerror=()=>{s.remove();res(false)};document.head.appendChild(s)})}
async function ensureJsQR(){if(window.jsQR)return true;if(NATIVE&&await loadScript('jsQR.js')&&window.jsQR)return true;return(await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'))&&!!window.jsQR}
function qrRegion(img,sx,sy,sw,sh,maxDim){const k=Math.min(2.5,maxDim/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);if(w<40||h<40)return null;const c=mkC(w,h),x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,sx,sy,sw,sh,0,0,w,h);const d=x.getImageData(0,0,w,h);const r=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});return r&&r.binaryData&&r.binaryData.length?new Uint8Array(r.binaryData):null}
function scanImage(img){const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;for(const m of[1000,700,1400]){const r=qrRegion(img,0,0,W,H,m);if(r)return r}for(const[a,b,c,d]of[[0,0,.6,.6],[.4,0,.6,.6],[0,.4,.6,.6],[.4,.4,.6,.6],[.2,.2,.6,.6],[.3,0,.7,.5],[.3,.5,.7,.5]]){const r=qrRegion(img,a*W,b*H,c*W,d*H,900);if(r)return r}return null}
let ibisImg=null;
function openIbis(){openSheet('ibis','Import ibisPaint brush',`<p class="note">In ibisPaint, open a brush’s menu and choose <b>Export Brush QR Code</b>, then pick that image here. Screenshots of brush QR codes posted online work too.</p><button class="btn pri" id="iPick">${icon('image')}Choose QR image</button><div id="iOut"></div>`,{tall:true});$('#iPick').onclick=()=>$('#fileQR').click()}
$('#fileQR').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)handleIbisFile(f)};
async function handleIbisFile(file){const out=$('#iOut');if(!out)return;out.innerHTML='<p class="note">Reading the QR code…</p>';if(!await ensureJsQR()){out.innerHTML='<p class="note">The QR reader couldn’t load. Check your connection and try again.</p>';return}
 const img=new Image();img.src=URL.createObjectURL(file);await img.decode().catch(()=>{});ibisImg=img;const bytes=scanImage(img);if(bytes)return showIbis(bytes);showCrop()}
async function showIbis(bytes){const out=$('#iOut');let p;try{p=await parseIbisBrush(bytes)}catch(e){out.innerHTML='<div class="card"><b>That QR code isn’t an ibisPaint brush.</b><p class="note">Try the image from ibisPaint’s Export Brush QR Code instead of a palette or link QR.</p></div>';return}
 let tip='round';out.innerHTML=`<div class="card"><div class="sect">Found a brush</div><div style="font-size:19px;font-weight:700">${esc(p.name)}</div><p class="note">Size ${Math.round(p.size*10)/10}px · spacing ${Math.round(p.spacing*1000)/10}% · ibis brush type ${p.baseId}</p><p class="note">Size and spacing are read straight from the code. The other ibisPaint settings aren’t mapped yet, so pick the tip that looks closest.</p>
 <div class="chips">${TIPS.map(([k,n])=>`<button class="chip ${k===tip?'on':''}" data-itip="${k}">${n}</button>`).join('')}</div><button class="btn pri" id="iAdd">${icon('plus')}Add to my brushes</button></div>`;
 $$('[data-itip]').forEach(b=>b.onclick=()=>{tip=b.dataset.itip;$$('[data-itip]').forEach(c=>c.classList.toggle('on',c===b))});
 $('#iAdd').onclick=()=>{const nb=ibisToBrush(p,tip);S.brushes.push(nb);S.brushSel.brush=nb.id;saveBrushes();savePrefs();setTool('brush');openBrushes();toast('Added '+p.name)}}
function showCrop(){const out=$('#iOut');out.innerHTML=`<div class="card"><b>Couldn’t spot the QR code by itself.</b><p class="note">Drag a box around just the QR code, then scan that area.</p><canvas id="cropC"></canvas><button class="btn pri" id="iScan">Scan this area</button></div>`;
 const c=$('#cropC'),img=ibisImg,W=img.naturalWidth,H=img.naturalHeight;const cw=c.getBoundingClientRect().width;c.width=cw*DPR;c.height=cw*H/W*DPR;c.style.height=(cw*H/W)+'px';const x=c.getContext('2d');let box=null;
 const draw=()=>{x.drawImage(img,0,0,c.width,c.height);if(box){x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,c.width,c.height);const k=c.width/W;x.drawImage(img,box.x,box.y,box.w,box.h,box.x*k,box.y*k,box.w*k,box.h*k);x.strokeStyle='#3b8beb';x.lineWidth=3*DPR;x.strokeRect(box.x*k,box.y*k,box.w*k,box.h*k)}};draw();
 let a=null;const pt=e=>{const r=c.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1)*W,y:clamp((e.clientY-r.top)/r.height,0,1)*H}};
 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);a=pt(e)};c.onpointermove=e=>{if(!a)return;const b=pt(e);box={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)};draw()};c.onpointerup=()=>{a=null};
 $('#iScan').onclick=()=>{if(!box||box.w<20)return toast('Drag a box around the QR first');for(const m of[700,1000,500]){const r=qrRegion(img,box.x,box.y,box.w,box.h,m);if(r)return showIbis(r)}toast('Still can’t read it. Try a sharper image or a tighter box.',3000)}}

$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const img=new Image();img.src=URL.createObjectURL(f);try{await img.decode()}catch(_){return toast('That file couldn’t be opened as an image')}
 const k=Math.min(1,S.W/img.naturalWidth,S.H/img.naturalHeight),w=img.naturalWidth*k,h=img.naturalHeight*k;const N=newLayer(f.name.replace(/\.[^.]+$/,'').slice(0,24)||'Photo');N.ctx.imageSmoothingQuality='high';N.ctx.drawImage(img,(S.W-w)/2,(S.H-h)/2,w,h);addLayerAt(N,S.active+1,'Place photo');if(S.sel){mc.clearRect(0,0,S.W,S.H);refreshSel()}setTool('move');toast('Photo placed. Drag, pinch or twist it, then tap Done.')};
async function getDL(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
const blobB64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)});
async function offer(filename,blob,mime){
 if(NATIVE&&NATIVE.saveFile){try{const res=String(NATIVE.saveFile(filename,mime,await blobB64(blob)));if(res.startsWith('error'))toast('Couldn’t save: '+res.slice(6),3500);else toast('Saved to '+res,3000)}catch(e){toast('Couldn’t save the file')}return}
 const dl=await getDL();if(dl){try{await dl.save({filename,data:blob});toast('Saved '+filename);return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('A save is already waiting for your answer')}}
 if(mime.startsWith('image/')){const u=URL.createObjectURL(blob);const v=document.createElement('div');v.id='viewer';v.innerHTML=`<img src="${u}" alt="Your exported artwork"><p class="note" style="color:#ddd;text-align:center">Press and hold the image to save it.</p><button class="btn pri">Done</button>`;v.querySelector('button').onclick=()=>v.remove();document.body.appendChild(v)}else toast('Saving files isn’t available in this view')}
function stamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function exportImage(kind){if(FL)return toast('Finish the transform first');compositeAll();let c=comp;if(kind==='jpg'){c=mkC(S.W,S.H);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S.W,S.H);x.drawImage(comp,0,0)}c.toBlob(b=>b&&offer('kanvas-'+stamp()+'.'+kind,b,kind==='jpg'?'image/jpeg':'image/png'),kind==='jpg'?'image/jpeg':'image/png',.92)}
function saveProject(){const data={app:'kanvas',v:1,W:S.W,H:S.H,active:S.active,name:S.docName,layers:S.layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,alphaLock:L.alphaLock,clip:L.clip,text:L.text,png:L.canvas.toDataURL('image/png')}))};offer('kanvas-'+stamp()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}),'application/json')}
$('#fileProj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='kanvas')throw 0;await loadDocData(d,async l=>{const i=new Image();i.src=l.png;await i.decode();return i});S.docName=f.name.replace(/\.json$/i,'');uiDoc();toast('Project opened')}catch(_){toast('That isn’t a Kanvas project file')}};
async function loadDocData(d,getImg){if(FL)cancelTransform();allocDoc(d.W,d.H);S.layers=[];for(const l of d.layers){const L=newLayer(l.name);Object.assign(L,{visible:l.visible,opacity:l.opacity,blend:l.blend,alphaLock:!!l.alphaLock,clip:!!l.clip,text:l.text||null});const im=await getImg(l);if(im)L.ctx.drawImage(im,0,0);S.layers.push(L)}S.active=clamp(d.active|0,0,S.layers.length-1);S.docName=d.name||'Untitled';S.undo=[];S.redo=[];S.histBytes=0;uiDoc();uiHist();uiTask();fitView();compositeAll();renderLayers();for(const L of S.layers)if(L.text)ensureFont(L.text)}

let dirtyT=null;function markDirty(){clearTimeout(dirtyT);dirtyT=setTimeout(saveDoc,2500)}
let saving=false;async function saveDoc(){if(saving||ST){markDirty();return}saving=true;try{const layers=[];for(const L of S.layers){const blob=await new Promise(r=>L.canvas.toBlob(r,'image/png'));layers.push({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,alphaLock:L.alphaLock,clip:L.clip,text:L.text,blob})}await DB.set('doc',{W:S.W,H:S.H,active:S.active,name:S.docName,layers})}catch(e){}saving=false}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(dirtyT);saveDoc()}});
let bT=null;function saveBrushes(){clearTimeout(bT);bT=setTimeout(()=>DB.set('brushes',{list:S.brushes,smudge:S.smudgeB,blur:S.blurB}),600)}
function savePrefs(){DB.set('prefs',{color:S.color,recent:S.recent,brushSel:S.brushSel,fill:S.fill,wand:S.wand,selMode:S.selMode,selOp:S.selOp,lastText})}

function showTips(force){if(!force&&LS.get('kanvas-tips2'))return;const d=document.createElement('div');d.id='tips';d.innerHTML=`<b>Gestures</b><ul><li>Two-finger tap: undo · three-finger tap: redo</li><li>Pinch and twist: zoom and rotate the view</li><li>Hold a finger still: sample a color</li><li>Tap the active tool again: its brushes or modes</li><li>Tap the zoom chip: fit the canvas to the screen</li></ul><button class="btn pri" style="align-self:flex-end">Got it</button>`;d.querySelector('button').onclick=()=>{LS.set('kanvas-tips2','1');d.remove()};$('#stage').appendChild(d)}

$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
new ResizeObserver(()=>{const first=!VW;resizeView();if(first)fitView()}).observe(view);
(async function boot(){
 const saved=await DB.get('brushes');if(saved&&saved.list&&saved.list.length){S.brushes=saved.list.map(normB);if(saved.smudge)S.smudgeB=normB(saved.smudge);if(saved.blur)S.blurB=normB(saved.blur)}else if(Array.isArray(saved)&&saved.length)S.brushes=saved.map(normB);else{S.brushes.push(...await seedIbis());saveBrushes()}
 const pr=await DB.get('prefs');if(pr){Object.assign(S,{color:pr.color||S.color,recent:pr.recent||[],brushSel:pr.brushSel||S.brushSel,fill:pr.fill||S.fill,wand:pr.wand||S.wand,selMode:pr.selMode||'lasso',selOp:pr.selOp||'new'});if(pr.lastText)lastText=pr.lastText}
 const fonts=await DB.get('fonts');if(fonts)for(const f of fonts)await addFontBuffer(f.name,f.buf,false);
 const doc=await DB.get('doc');
 if(doc&&doc.layers&&doc.layers.length){try{await loadDocData(doc,async l=>l.blob?await createImageBitmap(l.blob):null)}catch(e){newDoc(1200,1600)}}else newDoc(1200,1600);
 resizeView();fitView();uiColor();uiHist();setTool('brush');showTips(false);if(wideLayout())openLayers();
})();
