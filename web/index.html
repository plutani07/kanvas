<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Kanvas Studio — Draw, paint, create</title></head><body>

<style>
/* Two screens, the way ibisPaint does it: My Gallery (every artwork on this device) and the canvas.
   The canvas keeps the art on screen: undo/redo and three popups on top, one bottom bar of seven buttons,
   the current tool's sliders just above it, and one window at a time that the bar opens and closes. */
:root{
  --chrome:#1a1a1a; --panel:#2c2c2c; --win:#383838; --raised:#4a4a4a; --line:#4c4c4c; --stage:#262626;
  --fg:#f0f0f0; --mut:#b4b4b4; --dim:#8a8a8a; --acc:#3b8beb; --acc-hi:#6fb0ff; --danger:#ff6b6b;
  --bar:54px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button[disabled]{opacity:.35;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* canvas screen */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--st) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#stage{flex:1;position:relative;background:var(--stage);overflow:hidden;min-height:0;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.tg{display:flex;gap:6px;pointer-events:auto}
.rb{width:40px;height:40px;border-radius:50%;background:rgba(26,26,26,.86);border:1px solid #474747;display:grid;place-items:center}
.rb:active,.rb.on{background:#444}.rb.on{color:var(--acc-hi)}
#zoomChip{pointer-events:auto;margin-top:8px;background:rgba(26,26,26,.86);border:1px solid #474747;border-radius:14px;padding:4px 10px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s}
#zoomChip.on{opacity:1}
#lower{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
#lower>*{pointer-events:auto}
#dock{width:100%;max-width:560px;box-sizing:border-box;background:rgba(26,26,26,.9);border:1px solid #3c3c3c;border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.srow{display:grid;grid-template-columns:auto 32px 1fr 32px;align-items:center;gap:6px;min-height:38px}
.srow output{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:52px;white-space:nowrap}
.drow{display:flex;align-items:center;gap:8px;min-height:40px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mut);margin:0;padding:8px 2px}
.pm{width:30px;height:30px;border-radius:50%;background:#0f0f0f;border:1px solid #585858;display:grid;place-items:center;flex:none}
.pm svg{width:15px;height:15px;stroke-width:2.2}
.pm:active{background:#444}
#task{display:flex;gap:2px;background:rgba(44,44,44,.97);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:100%;overflow-x:auto;scrollbar-width:none}
#task button{padding:8px 10px;border-radius:8px;white-space:nowrap;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
#task button svg{width:17px;height:17px}
#task button:active{background:var(--raised)}
.xfp{display:flex;flex-direction:column;gap:4px;padding:2px 0}
.xtabs{display:flex;gap:2px}
.xtabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;font-size:11px;color:var(--mut)}
.xtabs button.on{color:var(--acc-hi);background:#2a3442}
.xrow{display:flex;align-items:center;gap:4px}
.xrow .hint{flex:1;padding:0 4px;line-height:1.3}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--fg);flex:none}
.ib:active,.ib.on{background:var(--raised)}
.ib.pri{background:var(--acc);color:#fff}
#loupe{position:absolute;width:62px;height:62px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #000,0 4px 14px rgba(0,0,0,.5);pointer-events:none;z-index:6;transform:translate(-50%,-130%)}

/* the bottom bar (canvas and gallery) */
.bbar{flex:none;height:calc(var(--bar) + var(--sb));padding-bottom:var(--sb);box-sizing:border-box;display:flex;background:var(--chrome);border-top:1px solid #000;position:relative;z-index:22}
.bbar>button{flex:1;display:grid;place-items:center;color:var(--fg);min-width:0}
.bbar>button:active,.bbar>button.on{background:#2c2c2c}
.bbar>button.on{color:var(--acc-hi)}
.bbar svg{width:24px;height:24px}
.bbar .txt{font-size:15px;font-weight:600;color:var(--acc-hi);display:flex;gap:6px;align-items:center}
.be{position:relative;width:30px;height:30px;display:block}
.be svg{position:absolute;width:19px;height:19px;color:var(--dim)}
.be svg:first-child{left:0;top:0;color:#fff}.be svg:last-child{right:0;bottom:0}
.be.e svg:first-child{color:var(--dim)}.be.e svg:last-child{color:#fff}
.tipdot{width:34px;height:34px;border-radius:50%;background:#4d4d4d;position:relative;display:grid;place-items:center;overflow:hidden}
.tipdot i{border-radius:50%;background:radial-gradient(circle,#fff 0 45%,rgba(255,255,255,.25) 100%)}
.tipdot b{position:absolute;left:0;right:0;bottom:1px;font-size:10px;font-weight:700;text-align:center;text-shadow:0 0 3px #000,0 0 2px #000;font-variant-numeric:tabular-nums}
.csw{width:24px;height:24px;border-radius:4px;border:2px solid #fff;box-shadow:0 0 0 1px #000;display:block}
.lyn{width:22px;height:22px;border:2px solid currentColor;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:4px 4px 0 -2px var(--chrome),4px 4px 0 0 currentColor;font-variant-numeric:tabular-nums}
#unfull{position:fixed;left:10px;bottom:calc(10px + var(--sb));z-index:22}
body.full #top,body.full #lower,body.full #bar{display:none}

/* popups: tools, menu, view, selection, stabilizer */
#pop{position:fixed;z-index:30;background:var(--win);border:1px solid #585858;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);padding:6px;max-width:calc(100vw - 16px);max-height:calc(100% - 130px);overflow-y:auto;touch-action:pan-y;box-sizing:border-box}
.tgrid{display:grid;grid-template-columns:repeat(2,80px);gap:2px}
.tgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:8px;font-size:11px}
.tgrid button svg{width:25px;height:25px}
.tgrid button.on{background:var(--acc);color:#fff}
.tgrid button:active{background:var(--raised)}
.plist{display:flex;flex-direction:column;gap:10px;padding:6px 8px;width:min(300px,calc(100vw - 40px));box-sizing:border-box}
.ptitle{font-weight:700;font-size:13px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;min-height:34px}
.prow.btns{justify-content:flex-start;flex-wrap:wrap;gap:6px}
.menu{gap:0;padding:2px;width:min(270px,calc(100vw - 40px))}
.mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;width:100%;text-align:left;font-size:14px}
.mi:active{background:var(--raised)}
.mi svg{color:var(--mut)}
.mi.dng{color:var(--danger)}.mi.dng svg{color:var(--danger)}
.sw2{width:46px;height:26px;border-radius:13px;background:#666;position:relative;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#eee;transition:left .15s}
.sw2.on{background:var(--acc)}.sw2.on::after{left:23px;background:#fff}

/* windows: one at a time, above the bar */
#sheet{position:fixed;left:6px;right:6px;bottom:calc(var(--bar) + var(--sb) + 6px);max-height:calc(100% - var(--bar) - var(--sb) - var(--st) - 70px);background:var(--win);border:1px solid #555;border-radius:14px;z-index:20;display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.55);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;overflow:hidden}
#sheet.open{opacity:1;transform:none;pointer-events:auto}
#sheet.tall{height:calc(100% - var(--bar) - var(--sb) - var(--st) - 70px)}
#sheet.mid{height:min(540px,calc(100% - var(--bar) - var(--sb) - var(--st) - 70px))}
@media (min-width:720px){#sheet{left:auto;right:10px;width:430px}#pop .plist{width:300px}}
.sh-head{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 14px;flex:none;min-height:44px}
#shBack:not([hidden])+h2{margin-left:-6px}
#sheet:has(#shBack:not([hidden])) .sh-head{padding-left:4px}
.sh-head h2{flex:1;margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shAct{display:flex;align-items:center;gap:4px}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 16px;touch-action:pan-y;display:flex;flex-direction:column;gap:12px}
.flush .sh-body{padding:0;gap:0;overflow:hidden;flex-direction:row}
.sh-foot{flex:none;border-top:1px solid #2a2a2a;background:#303030;padding:6px 10px}
.wrow{display:flex;flex-direction:column;gap:0}
.wtop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:0 2px}
.wtop output{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px}
.wctl{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:6px}

/* shared controls */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--raised);border:1px solid #5a5a5a;border-radius:8px;padding:8px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 10px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dng{color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:7px;background:#262626;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;background:#222;border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{padding:5px 9px;border-radius:6px;font-size:12px;white-space:nowrap;color:var(--mut);display:flex;align-items:center;gap:5px;justify-content:center}
.seg button svg{width:17px;height:17px}
.seg button.on{background:#5a5a5a;color:#fff}
.seg.wide{display:flex}.seg.wide button{flex:1}
.chipbtn{display:flex;align-items:center;gap:6px;background:#222;border:1px solid var(--line);border-radius:8px;padding:5px 9px;flex:none;max-width:180px}
.chipbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.chipbtn svg{width:14px;height:14px;color:var(--mut);flex:none}
.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex:none;white-space:nowrap}
.tog i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;display:block;transition:background .15s}
.tog i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#ddd;top:2px;left:2px;transition:left .15s}
.tog.on i{background:var(--acc)}.tog.on i::after{left:14px;background:#fff}
.tog.on{color:var(--fg)}
.sect{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;padding-top:4px}
.sl{display:grid;grid-template-columns:104px 1fr 50px;align-items:center;gap:10px}
.sl span:first-child{font-size:12.5px}
.sl output{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;touch-action:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#5e5e5e}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#f4f4f4;margin-top:-9px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#5e5e5e}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#f4f4f4;border:0}
input.grad::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--trk,#5e5e5e)}
input.grad::-webkit-slider-thumb{margin-top:-5px;border:2px solid #fff;background:transparent;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000}
input.grad::-moz-range-track{height:12px;border-radius:6px;background:var(--trk,#5e5e5e)}
input[type=text],input[type=number],textarea,select{background:#222;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:14px;width:100%;min-width:0;box-sizing:border-box;user-select:text;-webkit-user-select:text}
select{padding:6px 8px;font-size:13px}
textarea{min-height:72px;resize:vertical}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;text-align:left;width:100%}
.item:active{background:var(--raised)}
.item svg{color:var(--mut)}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.item .sub{font-size:11.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#262626;border:1px solid var(--line);border-radius:10px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;text-align:center}
.tile svg{width:26px;height:26px;color:var(--fg)}
.tile:active{background:var(--raised)}
.sw{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.14)}
.fontrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:8px;width:100%;text-align:left;border-bottom:1px solid #444}
.fontrow:active{background:var(--raised)}
.fontrow .fn{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fontrow .fc{font-size:10px;color:var(--mut);flex:none;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:0}
.card{background:#2c2c2c;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.anchor{display:grid;grid-template-columns:repeat(3,30px);gap:4px}
.anchor button{width:30px;height:30px;border-radius:5px;background:#222;border:1px solid var(--line)}
.anchor button.on{background:var(--acc);border-color:var(--acc)}
.badge{font-size:9px;font-weight:700;letter-spacing:.05em;background:#555;color:#ddd;border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:1px}
.badge.b{background:var(--acc);color:#fff}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:10px 10px;background-position:0 0,5px 5px}
#cropC{width:100%;border-radius:8px;touch-action:none;background:#fff}

/* brush window */
.bprev{position:relative;border-radius:10px;overflow:hidden;flex:none}
.bprev canvas{width:100%;height:84px;display:block}
.bprev span{position:absolute;left:10px;bottom:6px;font-size:13px;font-weight:600;color:#111}
.brow{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;border-radius:8px;width:100%;box-sizing:border-box;border:1px solid transparent;cursor:pointer}
.brow.on{background:#2f3d52;border-color:var(--acc)}
.brow canvas{width:110px;height:30px;flex:none}
.brow .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bsz{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}

/* color window */
#wheel{width:min(62vw,236px);aspect-ratio:1;display:block;margin:0 auto;touch-action:none;flex:none}
.hexi{width:120px!important;margin:0 auto;text-align:center;font-variant-numeric:tabular-nums;flex:none}
.cpair{display:flex;border-radius:6px;overflow:hidden;border:1px solid #000;margin-right:4px}
.cpair button{width:36px;height:26px}
.ctabs{display:flex;margin:-6px -10px}
.ctabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11px;color:var(--mut)}
.ctabs button.on{color:var(--acc-hi)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.pc{aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.18);min-width:0}
.pc.add{display:grid;place-items:center;background:#262626;border-style:dashed;color:var(--mut)}
.hist{display:flex;gap:4px;overflow-x:auto;touch-action:pan-x;padding-bottom:4px;flex:none}
.hist .pc{width:34px;height:34px;flex:none}

/* layer window */
.lyw{flex:1;display:flex;min-height:0;min-width:0}
.lycol{width:46px;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;overflow-y:auto;scrollbar-width:none;background:#303030}
.lycol::-webkit-scrollbar{display:none}
#lyList{flex:1;overflow-y:auto;min-width:0;touch-action:pan-y;background:#262626}
.ly{display:flex;align-items:center;gap:8px;padding:5px 4px 5px 6px;border-bottom:1px solid #1c1c1c;background:#323232;position:relative}
.ly.on{background:#3d4f6b}
.ly.clip{padding-left:20px}
.ly.drag{z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.6);opacity:.92}
.ly .nm{flex:1;min-width:0}
.ly .nm b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly .nm span{font-size:11px;color:var(--mut)}
.ly .eye{width:34px;height:34px;display:grid;place-items:center;color:var(--fg);flex:none}
.ly .eye.off{color:var(--dim)}
.ly .hdl{width:30px;height:40px;display:grid;place-items:center;color:var(--dim);flex:none;touch-action:none;cursor:grab}
.thumb{width:46px;height:46px;border-radius:3px;flex:none;border:1px solid #000}
.lybot{display:flex;align-items:center;gap:6px}
.lybot select{flex:1;width:auto}
.tog2{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;font-size:12px;color:var(--mut);border:1px solid var(--line);background:#262626;flex:none}
.tog2 svg{width:16px;height:16px}
.tog2.on{color:#fff;background:var(--acc);border-color:var(--acc)}

/* My Gallery */
#gallery{position:fixed;inset:0;z-index:15;background:#242424;display:none;flex-direction:column;padding:var(--st) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
body.gal #gallery{display:flex}
.gh{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;background:var(--chrome);border-bottom:1px solid #000}
.gh h1{flex:1;margin:0;font-size:17px;font-weight:700}
.gh h1 span{color:var(--mut);font-weight:500}
.tbtn{color:var(--acc-hi);font-size:15px;font-weight:600;padding:8px 10px}
#gGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;padding:14px;align-content:start;touch-action:pan-y}
.gcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 6px;border-radius:10px;border:2px solid transparent;min-width:0}
.gcard.on{border-color:var(--acc);background:rgba(59,139,235,.13)}
.gimg{width:100%;aspect-ratio:3/4;display:grid;place-items:center;position:relative}
.gimg img{max-width:100%;max-height:100%;box-shadow:0 2px 12px rgba(0,0,0,.55);display:block}
.gname{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsub{font-size:11px;color:var(--mut)}
.gchk{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:grid;place-items:center}
.gchk svg{width:15px;height:15px;stroke-width:3}
.chosen .gchk{background:var(--acc)}
.gempty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--mut);text-align:center}
.gempty svg{width:48px;height:48px}
.info{display:flex;gap:14px;align-items:flex-start}
.info .gimg{width:110px;flex:none}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.info dt{color:var(--mut)}.info dd{margin:0;font-variant-numeric:tabular-nums}
.tgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}

#toast{position:fixed;left:50%;top:calc(var(--st) + 60px);transform:translateX(-50%);background:rgba(20,20,20,.96);border:1px solid #555;padding:9px 14px;border-radius:10px;font-size:12.5px;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;box-sizing:border-box}
#toast.on{opacity:1}
#tips{position:absolute;left:10px;right:10px;bottom:130px;z-index:5;max-width:520px;margin:0 auto;background:rgba(44,44,44,.98);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tips b{color:var(--acc-hi)}
#tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#viewer img{max-height:75%;max-width:100%;border-radius:6px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
@media (prefers-reduced-motion:reduce){#sheet,#toast,#zoomChip{transition:none}}

function mapFree(u,v){const t=FL.t,w=FL.float.width,h=FL.float.height,lx=(u-.5)*w*t.s*t.fx,ly=(v-.5)*h*t.s*t.fy,c=Math.cos(t.r),s=Math.sin(t.r);return{x:t.tx+lx*c-ly*s,y:t.ty+lx*s+ly*c}}
function homog(q){const x0=q[0].x,y0=q[0].y,x1=q[1].x,y1=q[1].y,x2=q[2].x,y2=q[2].y,x3=q[3].x,y3=q[3].y;const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;let g=0,h=0;if(Math.abs(sx)>1e-9||Math.abs(sy)>1e-9){const den=dx1*dy2-dx2*dy1;if(Math.abs(den)>1e-12){g=(sx*dy2-dx2*sy)/den;h=(dx1*sy-sx*dy1)/den}}

function drawMapped(ctx,img,map,n){const w=img.width,h=img.height,G=[];for(let j=0;j<=n;j++){const row=[];for(let i=0;i<=n;i++)row.push(map(i/n,j/n));G.push(row)}

function xfHandles(){const m=mapper();if(FL.mode==='free'){const c=[m(0,0),m(1,0),m(1,1),m(0,1)],top=m(.5,0),ctr=m(.5,.5),dx=top.x-ctr.x,dy=top.y-ctr.y,l=Math.hypot(dx,dy)||1,off=34/S.view.s;return{corners:c,rot:{x:top.x+dx/l*off,y:top.y+dy/l*off},top,ctr}}return{pts:FL.mode==='persp'?FL.quad:FL.mesh}}

const fontStr=(t,sz)=>`${t.italic?'italic ':''}${t.bold?700:400} ${sz}px "${t.family}", system-ui, sans-serif`;
const loadedCss=new Set();
function linkFont(fam){if(loadedCss.has(fam)||myFonts.has(fam))return;loadedCss.add(fam);const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(fam).replace(/%20/g,'+')+'&display=swap';document.head.appendChild(l)}
async function ensureFont(t){linkFont(t.family);try{await Promise.race([document.fonts.load(fontStr(t,40),'Aa'),new Promise(r=>setTimeout(r,4000))])}catch(e){}}
function measureText(ctx,t){ctx.font=fontStr(t,t.size);try{ctx.letterSpacing=(t.spacing||0)+'px'}catch(e){}const lines=t.str.split('\n'),lh=t.size*(t.lh||1.2),ws=lines.map(l=>ctx.measureText(l).width);return{lines,lh,ws,w:Math.max(1,...ws),h:lh*lines.length}}

 m.lines.forEach((l,i)=>{const y=-m.h/2+m.lh*(i+.5);if(t.stroke>0){ctx.lineJoin='round';ctx.lineWidth=t.stroke*2;ctx.strokeStyle=t.strokeColor;ctx.strokeText(l,ax,y)}ctx.fillStyle=t.color;ctx.fillText(l,ax,y)});return m}
function textCanvas(t){const c0=mkC(4,4).getContext('2d');const m=measureText(c0,t);const pad=t.stroke*2+t.size*.35;const c=mkC(m.w+pad*2,m.h+pad*2),x=c.getContext('2d');x.translate(c.width/2,c.height/2);drawTextBlock(x,t);return c}

async function getDL(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
const blobB64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)});
async function offer(filename,blob,mime){
 if(NATIVE&&NATIVE.saveFile){try{const res=String(NATIVE.saveFile(filename,mime,await blobB64(blob)));if(res.startsWith('error'))toast('Couldn’t save: '+res.slice(6),3500);else toast('Saved to '+res,3000)}catch(e){toast('Couldn’t save the file')}return}
 const dl=await getDL();if(dl){try{await dl.save({filename,data:blob});toast('Saved '+filename);return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('A save is already waiting for your answer')}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Downloaded '+filename)}

function stamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function exportImage(kind){if(FL)return toast('Finish the transform first');compositeAll();let c=comp;if(kind==='jpg'){c=mkC(S.W,S.H);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S.W,S.H);x.drawImage(comp,0,0)}c.toBlob(b=>b&&offer(fileName(S.docName)+'-'+stamp()+'.'+kind,b,kind==='jpg'?'image/jpeg':'image/png'),kind==='jpg'?'image/jpeg':'image/png',.92)}
function saveProject(){if(FL)return toast('Finish the transform first');if(ST)endStroke();const data={app:'kanvas',v:1,W:S.W,H:S.H,active:S.active,name:S.docName,layers:S.layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,alphaLock:L.alphaLock,clip:L.clip,text:L.text,png:L.canvas.toDataURL('image/png')}))};offer(fileName(S.docName)+'-'+stamp()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}),'application/json')}
async function loadDocData(d,getImg){
 // Decode before changing the live document: panels never see a half-loaded layer stack.
 const images=[];try{for(const l of d.layers)images.push(await getImg(l))}catch(e){for(const im of images)im?.close?.();throw e}
 if(FL)cancelTransform();allocDoc(d.W,d.H);S.layers=[];
 for(let i=0;i<d.layers.length;i++){const l=d.layers[i],L=newLayer(l.name);Object.assign(L,{visible:l.visible,opacity:l.opacity,blend:l.blend,alphaLock:!!l.alphaLock,clip:!!l.clip,text:l.text||null});const im=images[i];if(im){L.ctx.drawImage(im,0,0);im.close?.()}S.layers.push(L)}
 S.active=clamp(d.active|0,0,S.layers.length-1);S.docName=d.name||'Untitled';S.undo=[];S.redo=[];S.histBytes=0;uiDoc();uiHist();uiTask();fitView();compositeAll();renderLayers();for(const L of S.layers)if(L.text)ensureFont(L.text)
}


/* ---------- My Gallery: every artwork on this device ----------
   'arts' is the list in display order (name, size, dates, a small thumbnail); each artwork's layers live under 'art:<id>'.
   Delete moves an artwork to 'trash' and keeps its layers until it is deleted from Recently deleted.
   Every write to these keys goes through one queue, so a save never interleaves with a rename or a delete.
   The single 'doc' key of v0.2 is copied into the gallery once and left in place as a backup. */
let ARTS=[],TRASH=[],inGallery=true,gPick=null,gSelMode=false;const gChosen=new Set();
let IO=Promise.resolve();const queue=fn=>{const p=IO.then(fn);IO=p.catch(()=>{});return p};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const writeLists=()=>queue(async()=>{await DB.put('arts',ARTS);await DB.put('trash',TRASH)});
const toBlob=(c,type,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),type,q));
function thumbOf(c){const k=Math.min(1,360/Math.max(c.width,c.height)),t=mkC(c.width*k,c.height*k),x=t.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c,0,0,t.width,t.height);return toBlob(t,'image/png')}
const TURL=new Map();function thumbURL(a){const c=TURL.get(a.id);if(c&&c.b===a.thumb)return c.u;if(c)URL.revokeObjectURL(c.u);const u=URL.createObjectURL(a.thumb);TURL.set(a.id,{b:a.thumb,u});return u}
const fmtDate=t=>t?new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'';
const fileName=n=>String(n||'kanvas').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,'').trim().slice(0,60)||'kanvas';
function nextName(){let n=0;for(const a of[...ARTS,...TRASH]){const m=/^Untitled (\d+)$/.exec(a.name);if(m)n=Math.max(n,+m[1])}return'Untitled '+(n+1)}

let dirtyT=null,dirty=false,saveState='saved',editRevision=0;
function markDirty(){dirty=true;editRevision++;saveState='pending';clearTimeout(dirtyT);dirtyT=setTimeout(saveDoc,2500)}
/* Called on every pause too (NATIVE onPause). Resolves once the open artwork is on disk. */
function saveDoc(){clearTimeout(dirtyT);if(!S.artId||!dirty)return IO;if(ST||FL){dirtyT=setTimeout(saveDoc,750);return IO}return queue(async()=>{while(dirty&&S.artId){await saveNow();if(saveState==='error')break}})}
async function saveNow(){if(!dirty||!S.artId)return;const id=S.artId,revision=editRevision,previousName=ARTS.find(a=>a.id===S.artId)?.name;
 // Capture all canvases and metadata before yielding. Drawing may continue while PNGs encode.
 saveState='saving';
 const W=S.W,H=S.H,active=S.active,name=S.docName;
 const pending=S.layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,alphaLock:L.alphaLock,clip:L.clip,text:L.text?{...L.text}:null,blob:toBlob(L.canvas,'image/png')}));
 const thumb=thumbOf(comp);
 try{const layers=await Promise.all(pending.map(async l=>({...l,blob:await l.blob}))),thumbnail=await thumb;
  const arts=ARTS.map(a=>a.id===id?{...a,name,W,H,layers:layers.length,updated:Date.now(),thumb:thumbnail}:a);
  await DB.batch([['art:'+id,{W,H,active,name,layers}],['arts',arts]]);
  const meta=ARTS.find(a=>a.id===id);if(meta){if(meta.name===previousName)meta.name=name;Object.assign(meta,{W,H,layers:layers.length,updated:arts.find(a=>a.id===id).updated,thumb:thumbnail})}
  if(S.artId===id&&revision===editRevision){dirty=false;saveState='saved'}else saveState='pending';
 }catch(e){dirty=true;saveState='error';toast('Couldn’t save this artwork. Download a project backup and check device storage.',5000)}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDoc()});
let bT=null;function saveBrushes(){clearTimeout(bT);bT=setTimeout(()=>DB.set('brushes',{list:S.brushes,smudge:S.smudgeB,blur:S.blurB}),600)}
function savePrefs(){DB.set('prefs',{color:S.color,recent:S.recent,brushSel:S.brushSel,fill:S.fill,wand:S.wand,selMode:S.selMode,selOp:S.selOp,lastText,set:S.set,palette:S.palette})}

/* Flattens a stored artwork the way compositeRect does, for exports and thumbnails without opening it. */
async function flattenRec(rec){const W=rec.W,H=rec.H,c=mkC(W,H),x=c.getContext('2d'),t=mkC(W,H),tx=t.getContext('2d'),Ls=rec.layers,im=[];
 for(const l of Ls)im.push(l.blob?await createImageBitmap(l.blob):null);
 for(let i=0;i<Ls.length;i++){const L=Ls[i];if(L.clip&&i>0)continue;const cl=[];let j=i+1;while(j<Ls.length&&Ls[j].clip){cl.push(j);j++}if(!L.visible||!im[i])continue;
  x.globalAlpha=L.opacity;x.globalCompositeOperation=L.blend||'source-over';x.drawImage(im[i],0,0);
  for(const k of cl){const C=Ls[k];if(!C.visible||!im[k])continue;tx.globalAlpha=1;tx.globalCompositeOperation='copy';tx.drawImage(im[k],0,0);tx.globalCompositeOperation='destination-in';tx.drawImage(im[i],0,0);x.globalAlpha=C.opacity;x.globalCompositeOperation=C.blend||'source-over';x.drawImage(t,0,0)}}
 x.globalAlpha=1;x.globalCompositeOperation='source-over';for(const bitmap of im)bitmap?.close?.();return c}
async function addRec(rec){const id=newId(),now=Date.now(),thumb=await thumbOf(await flattenRec(rec));
 await queue(async()=>{await DB.put('art:'+id,rec);ARTS.unshift({id,name:rec.name,W:rec.W,H:rec.H,created:now,updated:now,layers:rec.layers.length,thumb});await DB.put('arts',ARTS)});gPick=id;return id}

async function loadGallery(){TRASH=(await DB.get('trash'))||[];const arts=await DB.get('arts');if(Array.isArray(arts)){ARTS=arts;return}ARTS=[];
 const old=await DB.get('doc');
 if(old&&old.layers&&old.layers.length){try{await addRec({...old,name:old.name&&old.name!=='Untitled'?old.name:'Untitled 1'});toast('Your canvas is in My Gallery now')}catch(e){toast('Couldn’t move your saved canvas into the gallery. It is still kept on the device.',5000)}}
 else await DB.put('arts',[]).catch(()=>{})}

async function openArt(id){const m=ARTS.find(a=>a.id===id);if(!m)return;await saveDoc();if(dirty)return toast('Save failed. Download a project backup before switching artworks.');const rec=await DB.get('art:'+id);if(!rec||!rec.layers){toast('This artwork couldn’t be read from the device');return}
 try{await loadDocData(rec,async l=>l.blob?await createImageBitmap(l.blob):null)}catch(e){toast('This artwork couldn’t be opened');return}
 S.artId=id;S.docName=m.name;dirty=false;clearTimeout(dirtyT);gPick=id;showCanvas()}
async function createArt(w,h,pic){if(!Number.isInteger(w)||!Number.isInteger(h)||w<16||h<16||w>4096||h>4096)return toast('Canvas size must be whole pixels from 16 to 4096.');closeSheet();if(!inGallery&&FL)await applyTransform();await saveDoc();if(dirty)return toast('Save failed. Download a project backup before creating another canvas.');
 const id=newId(),now=Date.now(),name=nextName();newDoc(w,h);S.docName=name;
 if(pic){const L=S.layers[1];L.name=pic.name||'Picture';L.ctx.imageSmoothingQuality='high';L.ctx.drawImage(pic.img,0,0,w,h);compositeAll()}
 ARTS.unshift({id,name,W:w,H:h,created:now,updated:now,layers:S.layers.length,thumb:null});S.artId=id;gPick=id;dirty=true;showCanvas();saveDoc()}

 if(!ARTS.length)g.innerHTML=`<div class="gempty">${icon('newc')}<p>No artworks yet.</p><button class="btn pri" id="gFirst">${icon('plus')}New canvas</button></div>`;

 b.innerHTML=gSelMode?`<button id="gDelN" ${gChosen.size?'':'disabled'}><span class="txt" style="color:var(--danger)">${icon('trash')}Delete${gChosen.size?' ('+gChosen.size+')':''}</span></button><button id="gDone"><span class="txt">Done</span></button>`
  :`<button id="gNew" aria-label="New canvas">${icon('plus')}</button><button id="gInfo" aria-label="Artwork information" ${dis}>${icon('info')}</button><button id="gSave" data-owns="gsave" aria-label="Save image" ${dis}>${icon('save')}</button><button id="gMore" data-owns="gmore" aria-label="More">${icon('more')}</button><button id="gEdit" ${dis}><span class="txt">Edit</span></button>`;

$('#gGrid').addEventListener('click',e=>{const c=e.target.closest('[data-art]');if(!c)return;const id=c.dataset.art;

$('#gBar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

  return openPop('gmore',`<div class="plist menu">${one?`<button class="mi" data-gm="dup">${icon('copy')}<span>Duplicate</span></button><button class="mi dng" data-gm="del">${icon('trash')}<span>Delete</span></button>`:''}<button class="mi" data-gm="pic">${icon('image')}<span>New canvas from a picture</span></button><button class="mi" data-gm="import">${icon('open')}<span>Open a project file</span></button><button class="mi" data-gm="trash">${icon('rotl')}<span>Recently deleted (${TRASH.length})</span></button><button class="mi" data-gm="ibis">${icon('qr')}<span>Import ibisPaint brush (QR)</span></button><button class="mi" data-gm="settings">${icon('cog')}<span>Settings</span></button></div>`,b,'up')}});
function galAct(a){closePop();const id=gPick;

async function dupArt(id){const a=ARTS.find(x=>x.id===id);if(!a)return;await saveDoc();if(dirty)return toast('Save failed. Download a project backup before switching artworks.');const rec=await DB.get('art:'+id);if(!rec)return toast('Couldn’t read that artwork');

 try{await queue(async()=>{await DB.put('art:'+nid,{...rec,name});ARTS.splice(Math.max(0,ARTS.indexOf(a)),0,{...a,id:nid,name,created:now,updated:now});await DB.put('arts',ARTS)})}catch(e){return toast('Couldn’t duplicate it. The device may be out of space.')}

async function deleteArts(ids){if(!ids.length)return;const now=Date.now();
 for(const id of ids){const i=ARTS.findIndex(a=>a.id===id);if(i<0)continue;const[a]=ARTS.splice(i,1);TRASH.unshift({...a,deleted:now});if(S.artId===id){S.artId=null;dirty=false}}

 try{await writeLists();toast(ids.length>1?`Moved ${ids.length} artworks to Recently deleted`:'Moved to Recently deleted')}catch(e){toast('Couldn’t save that change on the device')}}
function openTrash(){openSheet('trash',`Recently deleted (${TRASH.length})`,TRASH.length?`<p class="note">Deleted artworks wait here until you delete them for good.</p><div class="tgrid2">${TRASH.map(a=>`<div class="tcard"><span class="gimg">${a.thumb?`<img src="${thumbURL(a)}" alt="">`:''}</span><span class="gname">${esc(a.name)}</span><span class="gsub">Deleted ${fmtDate(a.deleted)}</span><div class="row"><button class="btn sm" data-tr="${a.id}">Restore</button><button class="btn sm dng" data-tx="${a.id}">Delete</button></div></div>`).join('')}</div>`:'<p class="note">Nothing here. Deleted artworks wait here until you delete them for good.</p>',{tall:true});
 $$('[data-tr]').forEach(b=>b.onclick=async()=>{const i=TRASH.findIndex(a=>a.id===b.dataset.tr);if(i<0)return;const[a]=TRASH.splice(i,1);delete a.deleted;ARTS.unshift(a);gPick=a.id;renderGallery();openTrash();await writeLists().catch(()=>toast('Couldn’t save that change on the device'));toast('Restored '+a.name)});
 $$('[data-tx]').forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Delete for good?';return}const i=TRASH.findIndex(a=>a.id===b.dataset.tx);if(i<0)return;const[a]=TRASH.splice(i,1);
  try{await queue(async()=>{await DB.put('trash',TRASH);await DB.del('art:'+a.id)})}catch(e){toast('Couldn’t delete it from the device')}openTrash()})}
async function exportArt(id,kind){const a=ARTS.find(x=>x.id===id);if(!a)return;await saveDoc();if(dirty)return toast('Save failed. Download a project backup before switching artworks.');const rec=await DB.get('art:'+id);if(!rec)return toast('Couldn’t read that artwork');
 let c=await flattenRec(rec);if(kind==='jpg'){const j=mkC(c.width,c.height),x=j.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,j.width,j.height);x.drawImage(c,0,0);c=j}
 offer(fileName(a.name)+'-'+stamp()+'.'+kind,await toBlob(c,kind==='jpg'?'image/jpeg':'image/png',.92),kind==='jpg'?'image/jpeg':'image/png')}
async function exportArtProject(id){const a=ARTS.find(x=>x.id===id);if(!a)return;await saveDoc();if(dirty)return toast('Save failed. Download a project backup before switching artworks.');const rec=await DB.get('art:'+id);if(!rec)return toast('Couldn’t read that artwork');
 const layers=[];for(const l of rec.layers)layers.push({name:l.name,visible:l.visible,opacity:l.opacity,blend:l.blend,alphaLock:l.alphaLock,clip:l.clip,text:l.text,png:'data:image/png;base64,'+await blobB64(l.blob)});
 offer(fileName(a.name)+'-'+stamp()+'.json',new Blob([JSON.stringify({app:'kanvas',v:1,W:rec.W,H:rec.H,active:rec.active,name:a.name,layers})],{type:'application/json'}),'application/json')}
function validateProject(d){
 if(!d||d.app!=='kanvas'||!Number.isInteger(d.W)||!Number.isInteger(d.H)||d.W<16||d.H<16||d.W>4096||d.H>4096||!Array.isArray(d.layers)||!d.layers.length||d.layers.length>64||d.W*d.H*d.layers.length>64e6)throw new Error('Invalid project dimensions');
 for(const l of d.layers){if(!l||typeof l.name!=='string'||!BLENDS.some(([v])=>v===(l.blend||'source-over'))||!Number.isFinite(l.opacity??1)||(l.opacity??1)<0||(l.opacity??1)>1||typeof l.png!=='string'||!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(l.png))throw new Error('Invalid layer');}
}
async function projectPNG(data,W,H){const blob=await(await fetch(data)).blob(),im=await createImageBitmap(blob);try{if(im.width!==W||im.height!==H)throw new Error('Invalid layer size');return blob}finally{im.close()}}
$('#fileProj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());validateProject(d);const layers=[];for(const l of d.layers)layers.push({name:l.name,visible:l.visible!==false,opacity:l.opacity??1,blend:l.blend||'source-over',alphaLock:!!l.alphaLock,clip:!!l.clip,text:l.text||null,blob:await projectPNG(l.png,d.W,d.H)});
  await addRec({W:d.W,H:d.H,active:d.active|0,name:String(d.name||f.name.replace(/\.json$/i,'')).slice(0,60),layers});renderGallery();toast('Added to My Gallery')}catch(_){toast('That isn’t a Kanvas project file')}};
$('#fileNewPic').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const img=new Image();img.src=URL.createObjectURL(f);try{await img.decode()}catch(_){return toast('That file couldn’t be opened as a picture')}
 const k=Math.min(1,2560/Math.max(img.naturalWidth,img.naturalHeight));if(k<1)toast('The picture was scaled down to 2560 px so it stays smooth to draw on',3500);
 createArt(Math.max(16,Math.round(img.naturalWidth*k)),Math.max(16,Math.round(img.naturalHeight*k)),{img,name:f.name.replace(/\.[^.]+$/,'').slice(0,24)})};

function showTips(force){if(!force&&LS.get('kanvas-tips3'))return;$('#tips')&&$('#tips').remove();const d=document.createElement('div');d.id='tips';d.innerHTML=`<b>Gestures</b><ul><li>Two-finger tap: undo. Three-finger tap: redo.</li><li>Pinch and twist: zoom and turn the canvas.</li><li>Hold a finger still: pick a color.</li><li>The bottom bar opens tools, brush, color and layers. Tap the same button to close.</li><li>↓ hides everything for a clean look. ← goes back to My Gallery.</li></ul><button class="btn pri" style="align-self:flex-end">Got it</button>`;d.querySelector('button').onclick=()=>{LS.set('kanvas-tips3','1');d.remove()};$('#stage').appendChild(d)}

$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
new ResizeObserver(()=>{const first=!VW;resizeView();if(first)fitView()}).observe(view);
addEventListener('resize',()=>{if(popName)closePop()});
(async function boot(){
 const saved=await DB.get('brushes');if(saved&&saved.list&&saved.list.length){S.brushes=saved.list.map(normB);if(saved.smudge)S.smudgeB=normB(saved.smudge);if(saved.blur)S.blurB=normB(saved.blur)}else if(Array.isArray(saved)&&saved.length)S.brushes=saved.map(normB);else{S.brushes.push(...await seedIbis());saveBrushes()}
 const pr=await DB.get('prefs');if(pr){Object.assign(S,{color:pr.color||S.color,recent:pr.recent||[],brushSel:pr.brushSel||S.brushSel,fill:pr.fill||S.fill,wand:pr.wand||S.wand,selMode:pr.selMode||'lasso',selOp:pr.selOp||'new'});if(pr.lastText)lastText=pr.lastText;Object.assign(S.set,pr.set||{});if(Array.isArray(pr.palette))S.palette=pr.palette}
 if(!S.palette)S.palette=DEF_PAL.slice();
 const fonts=await DB.get('fonts');if(fonts)for(const f of fonts)await addFontBuffer(f.name,f.buf,false);
 newDoc(1200,1600);dirty=false;clearTimeout(dirtyT);
 await loadGallery();
 resizeView();uiColor();uiHist();setTool('brush');showGallery();
})();
