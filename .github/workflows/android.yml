name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KANVAS_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore signing key
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        env: { KS: '${{ secrets.KANVAS_KEYSTORE_B64 }}' }
        run: echo "$KS" | base64 -d > android/kanvas-release.jks
      - name: Build review APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Build release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KANVAS_STORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && '../kanvas-release.jks' || '' }}
          KANVAS_STORE_PASSWORD: ${{ secrets.KANVAS_STORE_PASSWORD }}
          KANVAS_KEY_ALIAS: ${{ secrets.KANVAS_KEY_ALIAS }}
          KANVAS_KEY_PASSWORD: ${{ secrets.KANVAS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kanvas-apk
          path: android/app/build/outputs/apk/**/*.apk
