name: Studio browser checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify bundled Android assets
        run: |
          npm run sync:android
          git diff --exit-code -- android/app/src/main/assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: tests/artifacts/*.png
